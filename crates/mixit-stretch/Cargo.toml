[package]
name = "mixit-stretch"
description = "Key lock and key shift for MixIt decks: Signalsmith Stretch natively, a pure-Rust phase vocoder everywhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mixit-dsp = { path = "../mixit-dsp" }
signalsmith-stretch = { workspace = true, optional = true }
realfft.workspace = true

[dev-dependencies]
mixit-dsp = { path = "../mixit-dsp", features = ["testkit"] }

[features]
default = ["signalsmith"]
# The native C++ stretcher. Turn off for wasm32 builds.
signalsmith = ["dep:signalsmith-stretch"]

[lints]
workspace = true
