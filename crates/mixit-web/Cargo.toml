[package]
name = "mixit-web"
description = "MixIt in the browser: the real engine, analysis and track generator for wasm32, behind a small C ABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mixit-core = { path = "../mixit-core" }
mixit-dsp = { path = "../mixit-dsp" }
mixit-engine = { path = "../mixit-engine" }
mixit-project = { path = "../mixit-project" }
mixit-stretch = { path = "../mixit-stretch", default-features = false }
mixit-analysis = { path = "../mixit-analysis" }
mixit-generator = { path = "../mixit-generator" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
mixit-dsp = { path = "../mixit-dsp", features = ["testkit"] }

[lints]
workspace = true
