[package]
name = "mixit-ml"
description = "Trained models on the person's own computer: the model files, ONNX Runtime and the stem splitter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["onnx", "voice"]
# Runs the models with ONNX Runtime. Without it the crate still builds (model files,
# downloads, the chunking plan) and every model reports that it is not available.
onnx = ["dep:ort"]
# Cleans the mic: echo cancelling (WebRTC's AEC3, pure Rust) and noise removal
# (DeepFilterNet3, built in, or RNNoise for the lowest delay).
voice = ["dep:sonora", "dep:nnnoiseless", "dep:deep_filter", "dep:ndarray"]

[dependencies]
mixit-io = { path = "../mixit-io" }
thiserror.workspace = true
ureq = "3"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"], optional = true }
sonora = { version = "0.3", optional = true }
nnnoiseless = { version = "0.5", default-features = false, optional = true }
# DeepFilterNet3 with its model built in (8 MB), run with tract (pure Rust).
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }

[dev-dependencies]
mixit-core = { path = "../mixit-core" }
mixit-generator = { path = "../mixit-generator" }
mixit-analysis = { path = "../mixit-analysis" }

[lints]
workspace = true
