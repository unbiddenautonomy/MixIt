name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Adding an unrelated label gets its own group, so it never cancels a real run.
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Which systems the per-system jobs run on. Everyday runs (pull requests and main)
  # check Linux, where the per-system rules (crates/mixit-host/src/platform.rs,
  # src/lib/platform.ts) are tested for all three systems. Version tags, manual runs
  # and pull requests labelled `full-ci` also build and test on Windows and macOS.
  EVERYDAY_SYSTEMS: '["ubuntu-latest"]'
  ALL_SYSTEMS: '["ubuntu-latest", "windows-latest", "macos-latest"]'

jobs:
  plan:
    name: Plan
    # Skip runs started by labels other than full-ci.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.pick.outputs.systems }}
    steps:
      - id: pick
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ]; then systems="$ALL_SYSTEMS"; else systems="$EVERYDAY_SYSTEMS"; fi
          echo "systems=$systems" >> "$GITHUB_OUTPUT"
          echo "Checking on: $systems" >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: Engine and tools (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Default members: every crate except the desktop app (built below).
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wasm:
    name: Web-ready crates (wasm32)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p mixit-core -p mixit-dsp -p mixit-engine -p mixit-analysis -p mixit-generator -p mixit-project
      - run: cargo build --target wasm32-unknown-unknown -p mixit-stretch --no-default-features
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser engine module
        working-directory: apps/desktop
        run: npm run wasm && node scripts/wasm-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mixit-wasm
          path: apps/desktop/public/mixit.wasm

  ui:
    name: Desktop UI
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser test
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Playwright and Chromium
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep pictures of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: apps/desktop/e2e-fail-*.png
          if-no-files-found: ignore

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: [plan, ui]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux webview and audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Build the UI
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo clippy -p mixit-desktop --all-targets -- -D warnings
      - run: cargo test -p mixit-desktop
