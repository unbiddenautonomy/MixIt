[package]
name = "mixit-desktop"
description = "The MixIt desktop app: Tauri shell, audio thread, library and jobs behind the React UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mixit_desktop"
path = "src/lib.rs"

[[bin]]
name = "mixit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mixit-core.workspace = true
mixit-dsp.workspace = true
mixit-engine.workspace = true
mixit-stretch.workspace = true
mixit-analysis.workspace = true
mixit-io.workspace = true
mixit-project.workspace = true
mixit-library.workspace = true
mixit-host.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
dirs.workspace = true
mixit-cli = { path = "../../../crates/mixit-cli" }

[lints]
workspace = true
